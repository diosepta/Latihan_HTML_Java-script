<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Penuh Warna</title>
    <style>
        /* CSS untuk gaya halaman */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5d0e3, #c5a3d7); /* Gradasi warna pink-ungu */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #4b0082; /* Warna teks utama ungu tua */
        }

        .todo-container {
            background-color: rgba(255, 255, 255, 0.9); /* Latar belakang kontainer putih transparan */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); /* Bayangan lebih kuat */
            width: 100%;
            max-width: 500px;
            text-align: center;
            backdrop-filter: blur(10px); /* Efek blur pada background di belakang kontainer */
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #8a2be2; /* Warna judul biru-ungu */
            margin-bottom: 25px;
            font-size: 2.8em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .input-group {
            display: flex;
            margin-bottom: 25px;
            gap: 15px;
        }

        #task-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1em;
            background-color: #f7f7f7;
            transition: border-color 0.3s, background-color 0.3s;
        }

        #task-input:focus {
            outline: none;
            border-color: #8a2be2; /* Warna border biru-ungu saat fokus */
            background-color: #fff;
        }

        #add-button {
            padding: 15px 30px;
            background: linear-gradient(45deg, #8e44ad, #b356e2); /* Gradasi pada tombol */
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #add-button:hover {
            transform: translateY(-3px); /* Efek sedikit terangkat saat hover */
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        #add-button:active {
            transform: translateY(0);
        }

        #task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .task-item {
            background-color: #fce4ec; /* Latar belakang item pink muda */
            border: 1px solid #f8bbd0;
            border-left: 5px solid #e91e63; /* Garis vertikal warna cerah */
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1em;
            color: #333;
            transition: transform 0.3s ease;
        }

        .task-item:hover {
            transform: scale(1.02); /* Sedikit membesar saat hover */
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h1>Daftar Tugas</h1>
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Tulis tugas baru...">
            <button id="add-button">Tambah</button>
        </div>
        <ul id="task-list">
            </ul>
    </div>

    <script>
        // JavaScript untuk logika aplikasi
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('task-input');
            const addButton = document.getElementById('add-button');
            const taskList = document.getElementById('task-list');

            addButton.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    addTask();
                }
            });

            function addTask() {
                const taskText = taskInput.value.trim();

                if (taskText !== "") {
                    const listItem = document.createElement('li');
                    listItem.className = 'task-item';
                    listItem.textContent = taskText;

                    taskList.appendChild(listItem);

                    taskInput.value = '';
                }
            }
        });
    </script>
</body>
</html>
